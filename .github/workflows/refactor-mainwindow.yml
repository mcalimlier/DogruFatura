name: DogruFatura MainWindow Safe Refactor

on:
  push:
    branches:
      - main
    paths:
      - 'tools/refactor-mainwindow.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: MainWindow dosyasını güvenli partial sınıflara ayır
        shell: pwsh
        run: .\tools\refactor-mainwindow.ps1

      - name: NuGet paketlerini yükle
        run: dotnet restore DogruFatura.sln

      - name: Release derlemesi
        run: dotnet build DogruFatura.sln -c Release --no-restore

      - name: Otomatik testler
        run: dotnet test DogruFatura.Tests/DogruFatura.Tests.csproj -c Release --no-build

      - name: Refaktörü kaydet
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DogruFatura.Wpf/MainWindow*.cs
          if (git diff --cached --quiet) {
            Write-Host 'Kaydedilecek refaktör değişikliği yok.'
            exit 0
          }
          git commit -m "DoğruFatura MainWindow mimari bölme"
          git push origin HEAD:main
