name: DogruFatura EXE Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: .NET 10 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Türkçe OCR modelini hazırla
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'DogruFatura.Wpf\Assets\Ocr'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/923915d4ced2a7235221788285785a29c4a42d4a/tur.traineddata'
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $dir 'tur.traineddata')
          if (-not (Test-Path (Join-Path $dir 'tur.traineddata'))) { throw 'tur.traineddata indirilemedi.' }

      - name: Restore
        run: dotnet restore DogruFatura.Wpf/DogruFatura.Wpf.csproj

      - name: Release publish
        run: >
          dotnet publish DogruFatura.Wpf/DogruFatura.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o "${{ runner.temp }}\DogruFaturaPublish"

      - name: EXE kontrolü
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'DogruFaturaPublish\DogruFatura.exe'
          if (-not (Test-Path $exe)) { throw 'DogruFatura.exe oluşturulamadı.' }
          Get-Item $exe | Format-List FullName,Length
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File (Join-Path $env:RUNNER_TEMP 'DogruFaturaPublish\DogruFatura.exe.sha256') -Encoding ascii

      - name: EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogruFatura-1.1-Final-EXE
          path: ${{ runner.temp }}/DogruFaturaPublish/*
          if-no-files-found: error
          retention-days: 14
